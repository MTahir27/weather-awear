[project]
name = "weather-awear-backend"
version = "0.1.0"
description = "Weather-aware truck routing API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.18.3",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "tenacity>=9.2.1",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=5.2,<6",
    "djangorestframework-stubs<3.17",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "respx>=0.23.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "DJ", "PT", "C4", "RET"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings_test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=trips --cov-report=term-missing:skip-covered"

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 95
exclude_also = ["if TYPE_CHECKING:"]
